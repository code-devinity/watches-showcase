<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Batman's Watch Collection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0a0b;
      color: #e5e5e5;
      min-height: 100vh;
      line-height: 1.6;
    }

    /* Layout */
    .app {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: #111112;
      border-right: 1px solid #1f1f1f;
      padding: 1.5rem;
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      overflow-y: auto;
      z-index: 100;
      transform: translateX(-100%);
      transition: transform 0.3s ease;
    }

    .sidebar.open {
      transform: translateX(0);
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #1f1f1f;
    }

    .sidebar-title {
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
    }

    .close-btn {
      background: none;
      border: none;
      color: #666;
      cursor: pointer;
      padding: 0.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .close-btn:hover {
      color: #fff;
    }

    .filter-section {
      margin-bottom: 1.5rem;
    }

    .filter-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .select-buttons {
      display: flex;
      gap: 0.25rem;
    }

    .select-btn {
      background: none;
      border: 1px solid #2a2a2a;
      color: #888;
      cursor: pointer;
      font-size: 0.7rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-family: inherit;
      transition: all 0.15s;
    }

    .select-btn:hover {
      color: #fff;
      border-color: #0066ff;
    }

    .filter-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #666;
      margin-bottom: 0.75rem;
      display: block;
    }

    /* Search */
    .search-box {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 0.65rem 0.875rem;
      color: #e5e5e5;
      font-size: 0.875rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box:focus {
      border-color: #0066ff;
    }

    .search-box::placeholder {
      color: #555;
    }

    /* Checkboxes */
    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      font-size: 0.875rem;
      color: #aaa;
    }

    .checkbox-item:hover {
      color: #fff;
    }

    .checkbox-item input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #0066ff;
      cursor: pointer;
    }

    /* Price Range */
    .price-inputs {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .price-input {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 0.5rem 0.625rem;
      color: #e5e5e5;
      font-size: 0.8rem;
      font-family: inherit;
      width: 100%;
      outline: none;
    }

    .price-input:focus {
      border-color: #0066ff;
    }

    .price-separator {
      color: #555;
      font-size: 0.8rem;
    }

    /* Main Content */
    .main {
      flex: 1;
      padding: 2rem;
      margin-left: 0;
      transition: margin-left 0.3s ease;
    }

    .main.shifted {
      margin-left: 280px;
    }

    /* Top Bar */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      gap: 1rem;
    }

    .menu-btn {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 0.5rem 0.75rem;
      color: #e5e5e5;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      font-family: inherit;
      transition: all 0.2s;
    }

    .menu-btn:hover {
      border-color: #444;
      background: #222;
    }

    .header-text {
      text-align: center;
      flex: 1;
    }

    .header-text h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      background: linear-gradient(135deg, #e5e5e5 0%, #888 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-text .subtitle {
      color: #666;
      font-size: 0.875rem;
    }

    .count {
      display: inline-block;
      padding: 0.35rem 0.85rem;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 100px;
      font-size: 0.8rem;
      color: #888;
      white-space: nowrap;
    }

    /* Overlay */
    .overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 99;
    }

    .overlay.visible {
      display: block;
    }

    /* Watches Grid */
    .watches-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .watch-card {
      background: #111112;
      border: 1px solid #1f1f1f;
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.2s ease;
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .watch-card:hover {
      border-color: #333;
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    }

    .watch-image {
      width: 100%;
      height: 180px;
      background: linear-gradient(135deg, #1a1a1a 0%, #222 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      margin-bottom: 1rem;
      overflow: hidden;
    }

    .watch-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 1rem;
    }

    .watch-image-placeholder {
      color: #333;
      font-size: 3.5rem;
    }

    .watch-content {
      padding: 1.25rem;
    }

    .watch-card h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #fff;
      line-height: 1.3;
    }

    .watch-price {
      font-size: 1.1rem;
      font-weight: 600;
      color: #0066ff;
      margin-bottom: 0.5rem;
    }

    .watch-price.on-request {
      color: #888;
      font-size: 0.9rem;
    }

    .watch-card .description {
      color: #777;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      line-height: 1.5;
    }

    .watch-card .link {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      color: #0066ff;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .watch-card:hover .link {
      text-decoration: underline;
    }

    .watch-card .added-date {
      color: #444;
      font-size: 0.7rem;
      margin-top: 0.75rem;
    }

    .watch-series {
      display: inline-block;
      font-size: 0.7rem;
      padding: 0.2rem 0.5rem;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      color: #666;
      margin-bottom: 0.5rem;
    }

    /* Specs strip (movement + watch type) */
    .specs-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.75rem;
      margin-bottom: 0.5rem;
    }

    .spec-item {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.7rem;
      padding: 0.2rem 0.55rem;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 100px;
      color: #aaa;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .spec-item svg {
      flex-shrink: 0;
      opacity: 0.7;
    }

    .spec-movement {
      background: linear-gradient(135deg, #1a1a1a 0%, #1f1f1f 100%);
      color: #c9a45c;
      border-color: #2a2418;
    }

    .spec-movement svg {
      color: #c9a45c;
      opacity: 0.9;
    }

    .spec-type {
      background: linear-gradient(135deg, #1a1a1a 0%, #1f1f1f 100%);
      color: #7ab8e6;
      border-color: #1a2230;
    }

    .spec-type svg {
      color: #7ab8e6;
      opacity: 0.9;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: #555;
      grid-column: 1 / -1;
    }

    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: 1rem;
      opacity: 0.3;
    }

    /* Footer */
    footer {
      text-align: center;
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid #1f1f1f;
      color: #555;
      font-size: 0.8rem;
    }

    footer a {
      color: #666;
      text-decoration: none;
    }

    footer a:hover {
      color: #888;
    }

    /* Active filters chips removed */

    /* Heart button */
    .heart-btn {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      background: rgba(0, 0, 0, 0.6);
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      z-index: 10;
    }

    .heart-btn:hover {
      background: rgba(0, 0, 0, 0.8);
      transform: scale(1.1);
    }

    .heart-btn svg {
      width: 18px;
      height: 18px;
      fill: #555;
      stroke: #555;
      transition: all 0.2s;
    }

    .heart-btn.hearted svg {
      fill: #e63946;
      stroke: #e63946;
    }

    .heart-btn.hearted {
      background: rgba(230, 57, 70, 0.15);
    }

    .watch-card {
      position: relative;
    }

    /* Image Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.92);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }

    .modal.open {
      display: flex;
    }

    .modal img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .modal-close {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      transition: background 0.2s;
    }

    .modal-close:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .modal-info {
      position: absolute;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      color: #fff;
      font-size: 0.9rem;
      text-align: center;
      max-width: 90vw;
    }

    .modal-info .watch-name {
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .modal-info .watch-price {
      color: #0066ff;
    }

    /* Favorites section */
    .favorites-section {
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #1f1f1f;
    }

    /* Mobile */
    @media (max-width: 768px) {
      .main {
        padding: 1.5rem;
      }

      .main.shifted {
        margin-left: 0;
      }

      .header-text h1 {
        font-size: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <div class="overlay" id="overlay"></div>

  <!-- Image Modal -->
  <div class="modal" id="imageModal" onclick="closeModal(event)">
    <button class="modal-close" onclick="closeModal(event)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
    <img id="modalImage" src="" alt="">
    <div class="modal-info" id="modalInfo"></div>
  </div>

  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">Filters</span>
        <button class="close-btn" onclick="toggleSidebar()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <!-- Search -->
      <div class="filter-section">
        <label class="filter-label">Search</label>
        <input type="text" class="search-box" id="searchInput" placeholder="Search watches...">
      </div>

      <!-- Favorites Filter -->
      <div class="filter-section favorites-section">
        <label class="filter-label">My Collection</label>
        <label class="checkbox-item">
          <input type="checkbox" id="showHearted">
          <span style="display: flex; align-items: center; gap: 0.35rem;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="#e63946" stroke="#e63946" stroke-width="2">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
            Hearted only
          </span>
        </label>
      </div>

      <!-- Price Filter -->
      <div class="filter-section">
        <label class="filter-label">Price Range (₹)</label>
        <div class="price-inputs">
          <input type="number" class="price-input" id="minPrice" placeholder="Min" min="0">
          <span class="price-separator">–</span>
          <input type="number" class="price-input" id="maxPrice" placeholder="Max" min="0">
        </div>
      </div>

      <!-- Brand Filter -->
      <div class="filter-section">
        <div class="filter-header">
          <label class="filter-label">Brand</label>
          <div class="select-buttons">
            <button class="select-btn" data-target="brandFilters" data-action="all">All</button>
            <button class="select-btn" data-target="brandFilters" data-action="none">None</button>
          </div>
        </div>
        <div class="checkbox-group" id="brandFilters">
        </div>
      </div>

      <!-- Movement Filter -->
      <div class="filter-section">
        <div class="filter-header">
          <label class="filter-label">Movement</label>
          <div class="select-buttons">
            <button class="select-btn" data-target="movementFilters" data-action="all">All</button>
            <button class="select-btn" data-target="movementFilters" data-action="none">None</button>
          </div>
        </div>
        <div class="checkbox-group" id="movementFilters">
        </div>
      </div>

      <!-- Watch Type Filter -->
      <div class="filter-section">
        <div class="filter-header">
          <label class="filter-label">Watch Type</label>
          <div class="select-buttons">
            <button class="select-btn" data-target="watchTypeFilters" data-action="all">All</button>
            <button class="select-btn" data-target="watchTypeFilters" data-action="none">None</button>
          </div>
        </div>
        <div class="checkbox-group" id="watchTypeFilters">
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main" id="main">
      <div class="topbar">
        <button class="menu-btn" onclick="toggleSidebar()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
          Filters
        </button>
        <div class="header-text">
          <h1>🕐 Watch Collection</h1>
          <p class="subtitle">Curated by Batman</p>
        </div>
        <span class="count" id="watch-count">0 watches</span>
      </div>

      <!-- Active filters chips removed as per user request -->


      <div class="watches-grid" id="watches-grid">
        <div class="empty-state" id="empty-state">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <p>No watches found</p>
          <p style="font-size: 0.85rem; margin-top: 0.5rem;">Try adjusting your filters</p>
        </div>
      </div>

      <footer>
        <p>Auto-updated from <a href="https://discord.com/channels/1476543517613359225/1546194995080331394" target="_blank" rel="noopener">#watches channel</a></p>
      </footer>
    </main>
  </div>

  <script>
    let watches = [];
    let filteredWatches = [];
    const HEARTED_KEY = 'watches_showcase_hearted';

    // Hearted management
    function getHearted() {
      try {
        return JSON.parse(localStorage.getItem(HEARTED_KEY) || '[]');
      } catch {
        return [];
      }
    }

    function saveHearted(list) {
      localStorage.setItem(HEARTED_KEY, JSON.stringify(list));
    }

    function isHearted(id) {
      return getHearted().includes(id);
    }

    function toggleHeart(event, id) {
      event.preventDefault();
      event.stopPropagation();
      let hearted = getHearted();
      if (hearted.includes(id)) {
        hearted = hearted.filter(h => h !== id);
      } else {
        hearted.push(id);
      }
      saveHearted(hearted);
      renderWatches(filteredWatches);
      updateHeartedCount();
    }

    function updateHeartedCount() {
      const count = getHearted().length;
      const existing = document.getElementById('hearted-count');
      if (count > 0) {
        if (!existing) {
          const el = document.createElement('span');
          el.id = 'hearted-count';
          el.className = 'count';
          el.style.background = '#1a1a1a';
          el.style.border = '1px solid #e63946';
          el.style.color = '#e63946';
          el.textContent = `❤️ ${count}`;
          document.querySelector('.header-text').appendChild(el);
        } else {
          existing.textContent = `❤️ ${count}`;
        }
      } else if (existing) {
        existing.remove();
      }
    }

    // Image Modal
    function openModal(watch) {
      const modal = document.getElementById('imageModal');
      const img = document.getElementById('modalImage');
      const info = document.getElementById('modalInfo');
      img.src = watch.image;
      img.alt = watch.name;
      info.innerHTML = `
        <div class="watch-name">${escapeHtml(watch.name)}</div>
        ${watch.price ? `<div class="watch-price">₹${watch.price.toLocaleString('en-IN')}</div>` : ''}
      `;
      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal(event) {
      if (event) event.stopPropagation();
      const modal = document.getElementById('imageModal');
      modal.classList.remove('open');
      document.body.style.overflow = '';
    }

    let modalHoverTimeout;
    function closeModalHover() {
      // Delay close slightly so mouse can move to modal
      modalHoverTimeout = setTimeout(() => {
        closeModal();
      }, 150);
    }

    // Keep modal open when hovering over it
    document.getElementById('imageModal').addEventListener('mouseenter', () => {
      clearTimeout(modalHoverTimeout);
    });

    // Close modal on Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const modal = document.getElementById('imageModal');
        if (modal.classList.contains('open')) {
          modal.classList.remove('open');
          document.body.style.overflow = '';
        }
      }
    });

    // Toggle Sidebar
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const main = document.getElementById('main');
      const overlay = document.getElementById('overlay');
      sidebar.classList.toggle('open');
      main.classList.toggle('shifted');
      overlay.classList.toggle('visible');
    }

    // Close sidebar on overlay click
    document.getElementById('overlay').addEventListener('click', toggleSidebar);

    // Load watches
    async function loadWatches() {
      try {
        const response = await fetch('./data/watches.json');
        const data = await response.json();
        watches = data.watches;
        initFilters();
        applyFilters();
        updateHeartedCount();
      } catch (error) {
        console.error('Failed to load watches:', error);
      }
    }

    // Initialize filters from data
    function initFilters() {
      // Extract unique brands
      const brands = [...new Set(watches.map(w => w.brand))].sort();
      const brandContainer = document.getElementById('brandFilters');
      brandContainer.innerHTML = brands.map(brand => `
        <label class="checkbox-item">
          <input type="checkbox" value="${brand}">
          ${brand}
        </label>
      `).join('');

      // Extract unique movements
      const movements = [...new Set(watches.map(w => w.movement).filter(Boolean))].sort();
      const movementContainer = document.getElementById('movementFilters');
      movementContainer.innerHTML = movements.map(m => `
        <label class="checkbox-item">
          <input type="checkbox" value="${m}">
          ${m}
        </label>
      `).join('');

      // Extract unique watch types
      const allTypes = new Set();
      watches.forEach(w => (w.watchType || []).forEach(t => allTypes.add(t)));
      const watchTypes = [...allTypes].sort();
      const watchTypeContainer = document.getElementById('watchTypeFilters');
      watchTypeContainer.innerHTML = watchTypes.map(t => `
        <label class="checkbox-item">
          <input type="checkbox" value="${t}">
          ${t}
        </label>
      `).join('');

      // Add event listeners for checkbox changes
      document.querySelectorAll('#brandFilters input, #movementFilters input, #watchTypeFilters input').forEach(cb => {
        cb.addEventListener('change', applyFilters);
      });

      // Add event listeners for All/None buttons
      document.querySelectorAll('.select-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          const target = btn.getAttribute('data-target');
          const action = btn.getAttribute('data-action');
          const checkboxes = document.querySelectorAll(`#${target} input[type="checkbox"]`);
          checkboxes.forEach(cb => {
            cb.checked = (action === 'all');
          });
          applyFilters();
        });
      });

      document.getElementById('searchInput').addEventListener('input', debounce(applyFilters, 200));
      document.getElementById('minPrice').addEventListener('input', debounce(applyFilters, 300));
      document.getElementById('maxPrice').addEventListener('input', debounce(applyFilters, 300));
      document.getElementById('showHearted').addEventListener('change', applyFilters);
    }

    // Apply filters
    function applyFilters() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const minPrice = parseInt(document.getElementById('minPrice').value) || 0;
      const maxPrice = parseInt(document.getElementById('maxPrice').value) || Infinity;
      const selectedBrands = [...document.querySelectorAll('#brandFilters input:checked')].map(cb => cb.value);
      const selectedMovements = [...document.querySelectorAll('#movementFilters input:checked')].map(cb => cb.value);
      const selectedWatchTypes = [...document.querySelectorAll('#watchTypeFilters input:checked')].map(cb => cb.value);
      const hasPriceFilter = document.getElementById('minPrice').value || document.getElementById('maxPrice').value;
      const showHeartedOnly = document.getElementById('showHearted').checked;
      const hearted = getHearted();

      filteredWatches = watches.filter(watch => {
        const matchesSearch = !searchTerm || 
          watch.name.toLowerCase().includes(searchTerm) ||
          (watch.description && watch.description.toLowerCase().includes(searchTerm));

        // If no brands selected, show all brands
        const matchesBrand = selectedBrands.length === 0 || selectedBrands.includes(watch.brand);
        
        // If no movements selected, show all movements
        const matchesMovement = selectedMovements.length === 0 || selectedMovements.includes(watch.movement);
        
        // If no watch types selected, show all watch types
        const matchesWatchType = selectedWatchTypes.length === 0 || 
          (watch.watchType && watch.watchType.some(t => selectedWatchTypes.includes(t)));
        
        // Only filter by price if user entered a price range AND watch has a price
        let matchesPrice = true;
        if (hasPriceFilter) {
          if (watch.price !== null) {
            matchesPrice = watch.price >= minPrice && watch.price <= maxPrice;
          } else {
            matchesPrice = false; // Hide null-price watches only when price filter is active
          }
        }

        // Hearted filter
        const matchesHearted = !showHeartedOnly || hearted.includes(watch.id);

        return matchesSearch && matchesBrand && matchesMovement && matchesWatchType && matchesPrice && matchesHearted;
      });

      renderWatches(filteredWatches);
    }

    // Render watches
    function renderWatches(watchesToRender) {
      const grid = document.getElementById('watches-grid');
      const emptyState = document.getElementById('empty-state');
      const countEl = document.getElementById('watch-count');

      // Clear grid except empty state
      grid.innerHTML = '';
      grid.appendChild(emptyState);

      if (!watchesToRender || watchesToRender.length === 0) {
        countEl.textContent = '0 watches';
        emptyState.style.display = 'block';
        return;
      }

      countEl.textContent = `${watchesToRender.length} watch${watchesToRender.length === 1 ? '' : 'es'}`;
      emptyState.style.display = 'none';

      watchesToRender.forEach(watch => {
        const card = document.createElement('a');
        card.href = watch.link;
        card.target = '_blank';
        card.rel = 'noopener noreferrer';
        card.className = 'watch-card';

        const date = new Date(watch.addedAt).toLocaleDateString('en-US', {
          month: 'short',
          day: 'numeric',
          year: 'numeric'
        });

        const priceHTML = watch.price 
          ? `<div class="watch-price">₹${watch.price.toLocaleString('en-IN')}</div>`
          : `<div class="watch-price on-request">Price on request</div>`;

        card.innerHTML = `
          <button class="heart-btn ${isHearted(watch.id) ? 'hearted' : ''}" onclick="toggleHeart(event, '${watch.id}')" title="${isHearted(watch.id) ? 'Remove from hearted' : 'Add to hearted'}">
            <svg viewBox="0 0 24 24" stroke-width="2">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
          </button>
          <div class="watch-content">
            ${watch.image ? `
              <div class="watch-image" onmouseenter="openModal(${JSON.stringify(watch).replace(/'/g, "&#39;")})" onmouseleave="closeModalHover()">
                <img src="${watch.image}" alt="${escapeHtml(watch.name)}" onerror="this.style.display='none'; this.parentElement.innerHTML='<span class=\\'watch-image-placeholder\\'>⌚</span>'">
              </div>
            ` : `
              <div class="watch-image">
                <span class="watch-image-placeholder">⌚</span>
              </div>
            `}
            ${watch.series ? `<span class="watch-series">${watch.series.replace(/-/g, ' ')}</span>` : ''}
            <h2>${escapeHtml(watch.name)}</h2>
            ${priceHTML}
            <p class="description">${escapeHtml(watch.description || '')}</p>
            <div class="specs-strip">
              ${watch.movement && watch.movement !== 'Unknown' ? `<span class="spec-item spec-movement"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>${watch.movement}</span>` : ''}
              ${watch.watchType && watch.watchType.length > 0 ? watch.watchType.slice(0, 3).map(t => {
                const icon = getWatchTypeIcon(t);
                return `<span class="spec-item spec-type">${icon}${t}</span>`;
              }).join('') : ''}
            </div>
            <span class="link">
              View Watch
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                <polyline points="15 3 21 3 21 9"/>
                <line x1="10" y1="14" x2="21" y2="3"/>
              </svg>
            </span>
            <p class="added-date">Added ${date}</p>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    function getWatchTypeIcon(type) {
      const icons = {
        'Dive': '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12c0 5.5 4.5 10 10 10s10-4.5 10-10S17.5 2 12 2 2 6.5 2 12z"/><path d="M12 2v20M2 12h20"/><circle cx="12" cy="12" r="3"/></svg>',
        'Chronograph': '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
        'Field': '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3v18"/></svg>',
        'Dress': '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12l3 6-9 12L3 9z"/><path d="M12 3v18"/></svg>',
        'GMT': '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 7 16.5M12 3a9 9 0 0 0-7 16.5"/><path d="M12 7v5l3 2"/></svg>',
        'Pilot': '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
        'Heritage': '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9v12M15 9v12M9 13h6"/></svg>',
        'Skeletal': '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18M15 3v18M3 15h18"/><circle cx="12" cy="12" r="2"/></svg>',
        'Minimalist': '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="12" x2="20" y2="12"/><circle cx="8" cy="12" r="1" fill="currentColor"/><circle cx="16" cy="12" r="1" fill="currentColor"/></svg>',
        'Limited Edition': '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.5 7H22l-6 4.5 2 7.5-6-4.5-6 4.5 2-7.5-6-4.5h7.5L12 2z"/></svg>',
        'Slim': '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M7 8h10M7 16h10"/></svg>',
        'Sports': '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>',
        'Smartwatch': '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4"/></svg>',
        'Ladies': '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M8 6c0-1 1-2 4-2s4 1 4 2M8 18c0 1 1 2 4 2s4-1 4-2"/><circle cx="12" cy="12" r="2"/></svg>',
        'Gents': '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>',
        'Cigar': '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 4l4 4M4 18h16M6 14l4 4M8 12l4 4M10 10l4 4M12 8l4 4M14 6l4 4"/></svg>',
        'Casual': '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12c2 4 5 6 9 6s7-2 9-6c-2-4-5-6-9-6s-7 2-9 6z"/></svg>',
      };
      return icons[type] || '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/></svg>';
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function debounce(fn, delay) {
      let timeout;
      return (...args) => {
        clearTimeout(timeout);
        timeout = setTimeout(() => fn(...args), delay);
      };
    }

    loadWatches();
  </script>
</body>
</html>
